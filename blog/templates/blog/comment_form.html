{% extends 'base.html' %}

{% block content %}
    <h2>Novo comentário em "{{ post.title }}"</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Enviar</button>
        <a href="{% url 'post_detail' post.pk %}" class="btn">Cancelar</a>
    </form>
{% endblock %}
