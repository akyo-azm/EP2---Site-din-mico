{% extends 'base.html' %}

{% block title %}{# TODO #}{% endblock %}

{% block content %}
    <h2>Confirmar remoção</h2>
    <p>Deseja realmente remover seu post: <strong>{{ post.title }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn">Confirmar</button>
        <a href="{% url 'post_detail' post.pk %}" class="btn">Cancelar</a>
    </form>
{% endblock %}
