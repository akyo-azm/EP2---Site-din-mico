{% extends 'base.html' %}

{% block title %}{# TODO #}{% endblock %}

{% block content %}
    <h2>Posts</h2>

    <ul>
        {% for post in posts %}
            <li>
                <a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a>
                <small>{{ post.posted_at|date:"d/m/Y H:i" }}</small>
            </li>
        {% empty %}
            <li>{# TODO: mensagem sem posts #}</li>
        {% endfor %}
    </ul>
{% endblock %}
